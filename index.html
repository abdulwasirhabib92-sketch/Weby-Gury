<div id="gatekeeperOverlay" class="gatekeeper-screen">
    <div class="gatekeeper-card" id="gatekeeperIdentityStep">
        <h2 class="logo">GURU<span>STUDIOS</span></h2>
        <p>Welcome to the production space. Please authenticate your identity to step inside.</p>
        <div class="input-group">
            <input type="text" id="gatekeeperNameInput" placeholder="Enter your name..." autocomplete="off">
            <button id="gatekeeperNextBtn" class="btn btn-primary">Next</button>
        </div>
    </div>

    <div class="gatekeeper-card hidden" id="gatekeeperQuizStep">
        <h2 class="logo">GURU<span>STUDIOS</span></h2>
        <p style="color: var(--accent-fuchsia); font-weight: 600;">Welcome, <span id="quizGreetingName"></span>!</p>
        <p>Before we unlock your custom workspace parameters, please answer this quick question:<br><br><strong>What do you think this website does?</strong></p>
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <input type="text" id="gatekeeperQuizInput" placeholder="Type your thoughts here..." autocomplete="off" style="width: 100%; background: var(--bg-main); border: 1px solid var(--border-subtle); padding: 0.85rem; border-radius: 8px; color: white;">
        </div>
        <button id="gatekeeperSubmitQuizBtn" class="btn btn-primary btn-block">Submit & Enter</button>
    </div>
</div>
